name: build

on:
  push:
  pull_request:

jobs:
  build:
    # Excel-DNA 1.9 packs .xll files on Linux too, so no Windows runner is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core
        run: dotnet test tests/Tracer.Core.Tests -c Release
      - name: Build add-in and installer
        # Building the setup builds and packs the add-in first (project reference).
        run: dotnet build src/Tracer.Setup -c Release
      - name: Collect
        run: |
          mkdir dist
          cp src/Tracer.Setup/bin/Release/net48/FormulaTracerSetup.exe dist/
          cp src/Tracer.AddIn/bin/Release/net48/publish/FormulaTracer64-packed.xll dist/
          cp src/Tracer.AddIn/bin/Release/net48/publish/FormulaTracer-packed.xll dist/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FormulaTracer
          path: dist/*

  release:
    # Pushing a tag such as v0.1.0 publishes a GitHub Release with the installer and the .xll files.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag matches the version and is on main
        # Refuses to publish a release built from the wrong commit (e.g. a stale local main was tagged).
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props at this commit. Tag origin/main after 'git fetch origin', or bump the version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not on main. Run 'git fetch origin' and tag origin/main."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: FormulaTracer
          path: dist
      - name: Create release
        # A release made by hand for the tag (e.g. on GitHub's "Draft a new release" page) gets the files attached
        # instead of failing the job.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Formula Tracer $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Formula Tracer $GITHUB_REF_NAME" --generate-notes
          fi
